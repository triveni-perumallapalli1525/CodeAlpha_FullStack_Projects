
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}ConnectHub{% endblock %}</title>
    <style>
        * { box-sizing: border-box; }
        body {
            margin: 0;
            font-family: Arial, sans-serif;
            background: #f0f2f5;
            color: #202124;
        }
        nav {
            background: #ffffff;
            padding: 16px 7%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 8px #00000012;
        }
        nav a { color: #3157d5; text-decoration: none; margin-left: 14px; }
        .brand { font-size: 23px; font-weight: bold; color: #3157d5; }
        .container { max-width: 760px; margin: 28px auto; padding: 0 16px; }
        .card {
            background: white;
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 18px;
            box-shadow: 0 2px 8px #0000000b;
        }
        input, textarea, button {
            font: inherit;
            padding: 11px;
            border-radius: 7px;
        }
        input, textarea { width: 100%; border: 1px solid #d4d8e0; margin: 7px 0; }
        button {
            border: 0;
            background: #3157d5;
            color: white;
            cursor: pointer;
        }
        .muted { color: #6b7280; font-size: 14px; }
        .actions { display: flex; gap: 10px; align-items: center; }
        .actions form { margin: 0; }
        .message { padding: 12px; background: #e6f7eb; border-radius: 8px; }
        a { color: #3157d5; }
        @media (max-width: 520px) {
            nav { padding: 14px; }
            .brand { font-size: 19px; }
            nav a { margin-left: 7px; }
        }
    </style>
</head>
<body>
    <nav>
        <a class="brand" href="{% url 'home' %}">ConnectHub</a>
        <div>
            {% if user.is_authenticated %}
                <a href="{% url 'profile' user.username %}">My Profile</a>
                <form action="{% url 'logout' %}" method="post" style="display:inline">
                    {% csrf_token %}
                    <button type="submit">Logout</button>
                </form>
            {% else %}
                <a href="{% url 'login' %}">Login</a>
                <a href="{% url 'register' %}">Register</a>
            {% endif %}
        </div>
    </nav>

    <main class="container">
        {% for message in messages %}
            <p class="message">{{ message }}</p>
        {% endfor %}
        {% block content %}{% endblock %}
    </main>
</body>
</html>
