
{% extends "social/base.html" %}

{% block title %}Register | ConnectHub{% endblock %}

{% block content %}
<div class="card">
    <h2>Create Your Account 🚀</h2>
    <p class="muted">Join ConnectHub and start connecting with people.</p>

    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Create Account</button>
    </form>

    <p>Already have an account?
        <a href="{% url 'login' %}">Login here</a>
    </p>
</div>
{% endblock %}
